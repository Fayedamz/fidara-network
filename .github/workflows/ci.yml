name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Contract job: format, lint, test, wasm build
  # ──────────────────────────────────────────────────────────────────────────
  contract:
    name: Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust 1.93.0 with wasm32v1-none target
        # dtolnay/rust-toolchain master @ 2026-10-16
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.93.0"
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache v2.7.8
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: contracts

      - name: cargo fmt --check
        working-directory: contracts
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: contracts
        run: cargo clippy --locked -- -D warnings

      - name: cargo test
        working-directory: contracts
        run: cargo test --locked

      - name: Build contract WASM (stellar contract build)
        working-directory: contracts
        # stellar contract build is the canonical command from the official docs.
        # It compiles --release --target wasm32v1-none and strips the output.
        # Requires Stellar CLI to be installed on the runner.
        # Install with: cargo install --locked stellar-cli@28.1.0
        run: |
          cargo install --locked stellar-cli --version 28.1.0
          stellar contract build

  # ──────────────────────────────────────────────────────────────────────────
  # Webapp job: typecheck, test, build
  # ──────────────────────────────────────────────────────────────────────────
  webapp:
    name: Web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node 26
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: npm ci
        working-directory: webapp
        run: npm ci

      - name: TypeScript typecheck
        working-directory: webapp
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: webapp
        run: npm test

      - name: Build
        working-directory: webapp
        run: npm run build
